<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="1024" height="1024">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b6cff"/>
      <stop offset="1" stop-color="#00c2b8"/>
    </linearGradient>
  </defs>

  <!-- outer ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#g)" stroke-width="6"/>
  <!-- inner filled disc -->
  <circle cx="100" cy="100" r="74" fill="url(#g)"/>

  <!-- dashed inner ring detail -->
  <circle cx="100" cy="100" r="60" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="3 7" opacity="0.7"/>

  <!-- mountain/peak mark -->
  <path d="M62,124 L88,86 L104,108 L118,88 L140,124 Z" fill="#ffffff"/>
  <!-- sun dot -->
  <circle cx="118" cy="72" r="9" fill="#ffffff"/>

  <!-- base line -->
  <line x1="55" y1="130" x2="145" y2="130" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
</svg>
